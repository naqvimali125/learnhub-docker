{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="narrow">
  <div class="crumbs"><a href="{% url 'course_manage' course.slug %}">{{ course.title }}</a> / {{ title }}</div>
  <div class="form-card">
    <h1>{{ title }}</h1>
    <form method="post">{% csrf_token %}
      {% include "partials/form_fields.html" %}
      <div class="form-actions"><button class="btn" type="submit">Create and add questions</button>
      <a class="btn ghost" href="{% url 'course_manage' course.slug %}">Cancel</a></div>
    </form>
  </div>
</div>
{% endblock %}

{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="narrow" style="width:min(760px,100% - 32px)">
  <div class="crumbs"><a href="{% url 'teach_dashboard' %}">Teaching</a> / {{ title }}</div>
  <div class="form-card">
    <h1>{{ title }}</h1>
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      {% include "partials/form_fields.html" %}
      <div class="form-actions">
        <button class="btn" type="submit">Save course</button>
        <a class="btn ghost" href="{% if course %}{% url 'course_manage' course.slug %}{% else %}{% url 'teach_dashboard' %}{% endif %}">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
